packages:
  - "apps/*"
  - "packages/*"
  - "worker"
allowBuilds:
  # Pure-JS Google SDK packages. Their install scripts are not needed at runtime;
  # verified by importing the SDK after install.
  '@google/genai': false
  esbuild: true
  # Optional native accelerator for msgpackr (pulled in by bullmq). The pure-JS
  # path is functionally identical, so the native build is declined.
  msgpackr-extract: false
  protobufjs: false
  sharp: true
